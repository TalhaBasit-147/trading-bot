version: "3.9"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: smc
      POSTGRES_PASSWORD: smc
      POSTGRES_DB: smc
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smc"]
      interval: 10s
      timeout: 5s
      retries: 5

  engine:
    build:
      context: ..
      dockerfile: docker/Dockerfile.engine
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql+psycopg://smc:smc@db:5432/smc
    volumes:
      - ../logs:/app/logs
      - ../models:/app/models
      - ../reports:/app/reports
      - ../data:/app/data
    ports:
      - "8080:8080"
    # Single worker: engine loop is not safe to parallelize.
    command: ["python", "scripts/run_paper.py"]

volumes:
  pgdata:
